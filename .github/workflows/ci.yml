name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          # The runner image's pre-installed stable varies: some images ship
          # it without rust-docs, and rustup's channel sync on top of it can
          # remove the previous components and finish without installing the
          # new ones ("using existing install", rustdoc missing at runtime).
          # Uninstall first so the install below is a fresh extract with all
          # required components, deterministically.
          rustup toolchain uninstall stable 2>/dev/null || true
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy,rust-docs --no-self-update
          rustup default stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test
