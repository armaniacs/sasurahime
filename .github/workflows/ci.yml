name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          # The runner image's toolchains say rust-docs is installed while
          # the actual files are pruned: rustup trusts the manifest ("is up
          # to date") and skips re-extraction, so rustdoc is missing exactly
          # where cargo's doctests invoke it. Force a real re-extraction by
          # removing and re-adding the component, then gate on the direct
          # binary. Bump PINNED deliberately.
          PINNED=1.99.1
          rustup toolchain uninstall "$PINNED" 2>/dev/null || true
          rustup toolchain install "$PINNED" --profile minimal \
            --component rustfmt,clippy,rust-docs --no-self-update
          rustup default "$PINNED"
          rustup component remove rust-docs 2>/dev/null || true
          rustup component add rustfmt clippy rust-docs
          "$(rustc --print sysroot)/bin/rustdoc" --version

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: |
          SYSROOT="$(rustc --print sysroot)"
          RUSTDOC_PATH="$SYSROOT/bin/rustdoc"
          "$RUSTDOC_PATH" --version
          # Diagnostic: the suite is itself a cache cleaner that provably
          # escaped its env-scoped isolation once (CHANGELOG v0.1.8, the
          # host-rustup cleanup flake). Name the moment rustdoc disappears,
          # then capture the end state (toolchains, RUSTUP_HOME, Trash) so
          # one run decides suite-vs-infrastructure and move-vs-delete.
          (
            while [ -e "$RUSTDOC_PATH" ]; do sleep 1; done
            echo "RUSTDOC-GONE at $(date -u +%H:%M:%S)"
          ) &
          WATCHER_PID=$!
          set +e
          cargo test
          STATUS=$?
          set -e
          kill "$WATCHER_PID" 2>/dev/null || true
          wait "$WATCHER_PID" 2>/dev/null || true
          echo "=== diagnostics ==="
          echo "--- rustup toolchain list ---"
          rustup toolchain list || true
          echo "--- toolchains dir ---"
          ls "$HOME/.rustup/toolchains/" || true
          echo "--- rustup env ---"
          env | grep -i rustup || echo "(RUSTUP_HOME unset)"
          echo "--- Trash ---"
          ls "$HOME/.Trash" 2>/dev/null | head -10 || echo "(empty/unreadable)"
          echo "--- rustdoc state ---"
          [ -e "$RUSTDOC_PATH" ] && echo present || echo ABSENT
          exit $STATUS
