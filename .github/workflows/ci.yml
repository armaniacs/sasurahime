name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          # The runner image's pre-installed "stable" is sometimes broken:
          # rustdoc is missing from it, and neither the --component flags on
          # a re-install nor `rustup component add` repair it, because rustup
          # takes the "existing install" path and skips the work. Install the
          # pinned version under its own name instead: that toolchain
          # directory is created by this run and cannot inherit whatever
          # state the image's "stable" carries. Bump PINNED deliberately.
          PINNED=1.99.1
          rustup toolchain install "$PINNED" --profile minimal \
            --component rustfmt,clippy,rust-docs --no-self-update
          rustup default "$PINNED"
          rustdoc --version

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test
