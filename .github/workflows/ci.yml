name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          # The runner image's pre-installed toolchains sometimes ship
          # without rust-docs, and rustup's "existing install" path skips
          # component installation even when --component flags are given, so
          # rustdoc ends up missing exactly where cargo's doctests invoke it:
          # the toolchain's bin directory, not the rustup shim. Uninstall the
          # pinned toolchain first so the existing-install path cannot
          # happen, force-add the components, then gate on the direct
          # binary. Bump PINNED deliberately.
          PINNED=1.99.1
          rustup toolchain uninstall "$PINNED" 2>/dev/null || true
          rustup toolchain install "$PINNED" --profile minimal \
            --component rustfmt,clippy,rust-docs --no-self-update
          rustup default "$PINNED"
          rustup component add rustfmt clippy rust-docs
          "$(rustc --print sysroot)/bin/rustdoc" --version

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test
